<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte de jeu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Chakra+Petch:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;display=swap">
<style>
body{margin:0;background:#0A0A0A}
.gcw{display:inline-block;perspective:900px;animation:gcDeal .7s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes gcDeal{0%{opacity:0;transform:translateY(60px) rotate(-14deg) scale(.85)}100%{opacity:1;transform:none}}
.gc{position:relative;box-sizing:border-box;border-radius:9%/6.4%;background:#EDEDED;color:#0A0A0A;box-shadow:0 2px 0 #9A9A9A,0 4px 0 #6A6A6A,0 14px 28px rgba(0,0,0,.55);transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;overflow:hidden;font-family:'Chakra Petch',system-ui,sans-serif}
.gc:hover{transform:translateY(-12px) rotateX(10deg) rotateY(-10deg);box-shadow:0 2px 0 #9A9A9A,0 4px 0 #6A6A6A,0 28px 40px rgba(0,0,0,.6)}
.gc::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 60%);transform:translateX(-120%);transition:transform .7s ease}
.gc:hover::after{transform:translateX(120%)}
.gc-in{position:absolute;inset:5.5%;border:1.5px solid #0A0A0A;border-radius:6%/4.2%;display:flex;flex-direction:column}
.gc-t{font-family:'Cinzel',Georgia,serif;font-weight:800;text-align:center;line-height:1.05;padding:.55em .5em .35em 2.1em;min-height:2.1em;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.gc-art{color:#0A0A0A;flex:1;margin:0 .45em;border:1px solid #0A0A0A;border-radius:.3em;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#DCDCDC 0 2px,#EDEDED 2px 6px)}
.gc-ty{font-size:.62em;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding:.45em 0 .2em}
.gc-tx{font-size:.7em;line-height:1.3;text-align:center;padding:0 .7em .8em;min-height:2.6em}
.gc-gem2{position:absolute;left:-2%;top:-2%;z-index:3;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
.gc-gem{position:absolute;left:-1%;top:-1%;width:30%;aspect-ratio:1;display:grid;place-items:center;font-weight:700;font-size:1.05em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.gc-actif .gc{box-shadow:0 0 0 3px #0A0A0A,0 0 0 5px #F2F2F2,0 18px 36px rgba(0,0,0,.6);transform:translateY(-14px)}
.gc-grise .gc{filter:grayscale(1) brightness(.55)}
.gc-dos .gc{background:#0F0F0F;box-shadow:0 2px 0 #333,0 4px 0 #1A1A1A,0 14px 28px rgba(0,0,0,.55)}
.gc-dos .gc-in{border-color:#F2F2F2;background:repeating-linear-gradient(45deg,transparent 0 9px,rgba(242,242,242,.14) 9px 10px),repeating-linear-gradient(-45deg,transparent 0 9px,rgba(242,242,242,.14) 9px 10px);align-items:center;justify-content:center}
.gc-dos .gc-emb{width:42%;aspect-ratio:1;border:1.5px solid #F2F2F2;border-radius:50%;display:grid;place-items:center;color:#F2F2F2;font-family:'Cinzel',serif;font-weight:800;font-size:1.6em;background:#0F0F0F}

.gc-rar{position:absolute;left:0;right:0;bottom:1.6%;display:flex;justify-content:center;gap:.28em;z-index:2}
.gc-rar i{width:.42em;height:.42em;transform:rotate(45deg);background:#0A0A0A;box-shadow:0 0 0 1px #EDEDED}
.gc-in,.gc-art{position:relative}
.gc-in{position:absolute}
/* Peu commune : toile de lin, double filet, coins */
.r-peu .gc{background:#E6E1D5}
.r-peu .gc-in{background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),#ECE7DB;box-shadow:inset 0 0 0 2px #ECE7DB,inset 0 0 0 3px #0A0A0A}
.r-peu .gc-art{background:repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 1px,transparent 1px 4px),repeating-linear-gradient(-45deg,rgba(0,0,0,.06) 0 1px,transparent 1px 4px),#F3EFE5}
.r-peu .gc-in::before,.r-peu .gc-in::after{content:'';position:absolute;top:-.3em;width:.55em;height:.55em;background:#0A0A0A;transform:rotate(45deg)}
.r-peu .gc-in::before{left:-.3em}.r-peu .gc-in::after{right:-.3em}
/* Rare : acier brossé, rivets */
.r-rare .gc{background:repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 1px,rgba(0,0,0,.05) 1px 2px),linear-gradient(135deg,#F2F3F5 0,#AEB4BD 30%,#E6E8EB 50%,#8E959F 72%,#D5D8DC 100%)}
.r-rare .gc-in{border-color:#3C424B;background:repeating-linear-gradient(0deg,rgba(255,255,255,.4) 0 1px,rgba(0,0,0,.04) 1px 2px),linear-gradient(180deg,#DCDFE3,#B9BEC6);box-shadow:inset 0 1px 0 #FFFFFF,inset 0 -1px 0 #7C838D}
.r-rare .gc-art{border-color:#3C424B;background:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.7),transparent 50%),repeating-linear-gradient(90deg,#C3C8CF 0 1px,#B3B9C1 1px 2px);box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.r-rare .gc-in::before,.r-rare .gc-in::after{content:'';position:absolute;bottom:.4em;width:.42em;height:.42em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#6E747E 70%)}
.r-rare .gc-in::before{left:.4em}.r-rare .gc-in::after{right:.4em}
.r-rare .gc-rar i{background:#3C424B;box-shadow:0 0 0 1px #E6E8EB}
/* Épique : obsidienne veinée, verre noir */
.r-epique .gc{background:radial-gradient(60% 40% at 20% 15%,rgba(255,255,255,.18),transparent 60%),linear-gradient(135deg,#2A2A2A,#060606 45%,#1E1E1E 65%,#030303);color:#F2F2F2;box-shadow:0 2px 0 #444,0 4px 0 #222,0 14px 30px rgba(0,0,0,.7),0 0 0 1px #8A8A8A}
.r-epique .gc-in{border-color:#CFCFCF;background:radial-gradient(80% 30% at 70% 80%,rgba(255,255,255,.07),transparent 70%),linear-gradient(160deg,#151515,#070707 60%,#121212);box-shadow:inset 0 0 0 2px #0B0B0B,inset 0 0 0 3px #5E5E5E}
.r-epique .gc-art{color:#F2F2F2;border-color:#CFCFCF;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 31%,transparent 33%),linear-gradient(65deg,transparent 55%,rgba(255,255,255,.07) 56%,transparent 58%),radial-gradient(circle at 50% 45%,#1E1E1E,#050505 75%)}
.r-epique .gc-rar i{background:#F2F2F2;box-shadow:0 0 0 1px #111}
/* Légendaire : or massif repoussé */
.r-leg .gcw-in{filter:drop-shadow(0 0 16px rgba(224,168,46,.5))}
.r-leg .gc{background:linear-gradient(135deg,#FFF3C4 0,#E0A82E 26%,#FFF7D6 46%,#B07A18 66%,#F7D774 84%,#C99327 100%);color:#3A2604}
.r-leg .gc-in{border-color:#5A3E08;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.45),transparent 55%),linear-gradient(160deg,#F7D774,#D9A23A 45%,#F3CC63 70%,#B9831C);box-shadow:inset 0 0 0 2px rgba(255,243,196,.8),inset 0 0 0 3px #8A5E12}
.r-leg .gc-art{color:#3A2604;border-color:#5A3E08;background:radial-gradient(circle,rgba(255,250,220,.9) 0,rgba(255,250,220,0) 60%),repeating-radial-gradient(circle at 50% 50%,#E9BE52 0 3px,#D6A23A 3px 6px);box-shadow:inset 0 2px 5px rgba(90,62,8,.45)}
.r-leg .gc-rar i{background:#5A3E08;box-shadow:0 0 0 1px #FFF3C4}
.r-leg .gc::after{background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.85) 48%,transparent 60%)}
.r-epique .gc::after,.r-leg .gc::after,.r-div .gc::after{animation:gcSheen 3.2s ease-in-out infinite}
@keyframes gcSheen{0%,35%{transform:translateX(-120%)}70%,100%{transform:translateX(120%)}}
.r-epique .gc::after{background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.28) 48%,transparent 58%)}
.spark{position:absolute;width:.7em;height:.7em;z-index:3;pointer-events:none;background:#FFF6CF;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:spark 2.2s ease-in-out infinite;opacity:0}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
/* Divine : holographique sur toute la carte */
.r-div .gcw-in{animation:gcFloat 3.6s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,255,255,.4))}
@keyframes gcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.r-div .gc{background:conic-gradient(from 0deg,#FF6B8B,#FFB86B,#FFF27A,#7BFFB0,#6BD6FF,#9C7BFF,#FF6BD6,#FF6B8B);animation:holo 6s linear infinite;color:#FFFFFF}
@keyframes holo{to{filter:hue-rotate(360deg)}}
.r-div .gc-in{border-color:#FFFFFF;background:linear-gradient(125deg,rgba(255,255,255,.55),rgba(255,255,255,0) 30%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 70%,rgba(255,255,255,.5)),conic-gradient(from 90deg at 50% 60%,#FF8FA8,#FFD08F,#FFF59A,#9FFFC8,#8FE2FF,#B8A0FF,#FF8FE2,#FF8FA8);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.r-div .gc-t,.r-div .gc-ty,.r-div .gc-tx{color:#0A0A0A;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.r-div .gc-art{color:#FFFFFF;border-color:#FFFFFF;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%),#0B0B0B}
.r-div .gc-rar i{background:#FFFFFF;box-shadow:0 0 6px #FFFFFF}
.r-div .gc::after{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 48%,transparent 66%)}
.rays{position:absolute;inset:-35%;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.16) 0 6deg,transparent 6deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%);mask-image:radial-gradient(circle,#000 25%,transparent 68%);animation:rays 14s linear infinite;pointer-events:none}
@keyframes rays{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.gcw,.gcw *,.gc::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="gcw gc-{{etat}} r-{{rar}}" style="animation-delay: {{delay}}s">
<div class="gcw-in" style="position: relative">
<sc-if value="{{isDiv}}" hint-placeholder-val="{{ false }}"><div class="rays"></div></sc-if>
<div class="gc" style="width: {{w}}px; height: {{h}}px; font-size: {{fs}}px">
<sc-if value="{{face}}" hint-placeholder-val="{{ true }}">
<div class="gc-in">
<div class="gc-t" style="font-size: 1em">{{titre}}</div>
<div class="gc-art">
<sc-if value="{{i.epee}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 3H21v6.5L10.5 20 4 13.5z"></path><path d="M6.5 16l-3.5 3.5"></path><path d="M8 11l5 5"></path></svg></sc-if>
<sc-if value="{{i.bouclier}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M12 7v10"></path></svg></sc-if>
<sc-if value="{{i.oeil}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
<sc-if value="{{i.parole}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"></path><path d="M8 10h8"></path></svg></sc-if>
<sc-if value="{{i.pas}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16c2-1 3-4 3-7a2 2 0 0 1 4 0c0 4-3 6-7 7z"></path><path d="M13 20c2-1 3-4 3-7a2 2 0 0 1 4 0c0 4-3 6-7 7z"></path></svg></sc-if>
<sc-if value="{{i.sort}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"></path></svg></sc-if>
<sc-if value="{{i.crane}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11a7 7 0 0 1 14 0c0 3-1.5 4.5-3 5.5V20H8v-3.5C6.5 15.5 5 14 5 11z"></path><circle cx="9.5" cy="11" r="1.6"></circle><circle cx="14.5" cy="11" r="1.6"></circle><path d="M11 20v-2"></path><path d="M13 20v-2"></path></svg></sc-if>
<sc-if value="{{i.parchemin}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11v14a3 3 0 0 1-3 3H6z"></path><path d="M14 20a3 3 0 0 0 3-3"></path><path d="M9 8h5"></path><path d="M9 12h5"></path></svg></sc-if>
<sc-if value="{{i.porte}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V5a6 6 0 0 1 12 0v16z"></path><path d="M4 21h16"></path><circle cx="14.5" cy="13" r="1"></circle></svg></sc-if>
</div>
<div class="gc-ty">{{type}}</div>
<div class="gc-tx">{{texte}}</div>
</div>
<sc-if value="{{statGem}}" hint-placeholder-val="{{ true }}">
<div class="gc-gem2" style="width: {{gs}}px; height: {{gs}}px"><dc-import name="Gemme" stat="{{stat}}" valeur="{{valeur}}" taille="{{gs}}" hint-size="{{gs}}px,{{gs}}px"></dc-import></div>
</sc-if>
<sc-if value="{{plainGem}}" hint-placeholder-val="{{ false }}">
<div class="gc-gem" style="background: {{gemBg}}; color: {{gemFg}}; clip-path: {{clip}}">{{valeur}}</div>
</sc-if>
</sc-if>
<sc-if value="{{back}}" hint-placeholder-val="{{ false }}">
<div class="gc-in"><div class="gc-emb">P</div></div>
</sc-if>
<sc-if value="{{hasRar}}" hint-placeholder-val="{{ false }}"><div class="gc-rar" role="img" aria-label="Rareté : {{rarName}}"><sc-for list="{{pips}}" as="p" hint-placeholder-count="3"><i></i></sc-for></div></sc-if>
</div>
<sc-if value="{{sparkle}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{sparks}}" as="k" hint-placeholder-count="4"><span class="spark" style="left: {{k.x}}%; top: {{k.y}}%; animation-delay: {{k.d}}s; font-size: {{fs}}px"></span></sc-for>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"titre":{"editor":"text","default":"Frappe"},"type":{"editor":"text","default":"Action"},"texte":{"editor":"text","default":"Attaque au corps à corps."},"valeur":{"editor":"text","default":"+5"},"stat":{"editor":"enum","options":["atq","pv","ca","mag","mvt","ini","none"],"default":"atq"},"icon":{"editor":"enum","options":["epee","bouclier","oeil","parole","pas","sort","crane","parchemin","porte"],"default":"epee"},"etat":{"editor":"enum","options":["normal","actif","grise","dos"],"default":"normal"},"rarete":{"editor":"enum","options":["aucune","commune","peu-commune","rare","epique","legendaire","divine"],"default":"aucune"},"w":{"editor":"int","default":150,"min":60,"max":400},"delay":{"editor":"float","default":0},"$preview":{"width":150,"height":210}}'>
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w ?? 150);
    const stat = this.props.stat ?? 'atq';
    const etat = this.props.etat ?? 'normal';
    const iconName = this.props.icon ?? 'epee';
    const colors = { pv: '#FF4D5E', atq: '#FF9F1C', ca: '#3D9BFF', mag: '#B28CFF', mvt: '#2EE6A6', ini: '#FFD60A', none: '#0A0A0A' };
    const clips = {
      pv: 'circle(48% at 50% 50%)',
      atq: 'polygon(50% 0, 100% 50%, 50% 100%, 0 50%)',
      ca: 'polygon(50% 0, 100% 16%, 100% 58%, 50% 100%, 0 58%, 0 16%)',
      mag: 'polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0 50%)',
      mvt: 'polygon(0 0, 68% 0, 100% 50%, 68% 100%, 0 100%, 30% 50%)',
      ini: 'circle(48% at 50% 50%)',
      none: 'circle(48% at 50% 50%)'
    };
    const i = {};
    ['epee', 'bouclier', 'oeil', 'parole', 'pas', 'sort', 'crane', 'parchemin', 'porte'].forEach((k) => { i[k] = k === iconName; });
    const valeur = this.props.valeur ?? '+5';
    const R = { 'commune': ['com', 1, 'commune'], 'peu-commune': ['peu', 2, 'peu commune'], 'rare': ['rare', 3, 'rare'], 'epique': ['epique', 4, 'épique'], 'legendaire': ['leg', 5, 'légendaire'], 'divine': ['div', 6, 'divine'] };
    const r = R[this.props.rarete] || null;
    return {
      w, h: Math.round(w * 1.4), fs: Math.round((w / 150) * 14 * 10) / 10,
      icon: Math.round(w * 0.32),
      titre: this.props.titre ?? 'Frappe',
      type: this.props.type ?? 'Action',
      texte: this.props.texte ?? 'Attaque au corps à corps.',
      valeur, hasGem: valeur !== '', stat,
      statGem: valeur !== '' && stat !== 'none', plainGem: valeur !== '' && stat === 'none', gs: Math.round(w * 0.34),
      gemBg: colors[stat] || colors.none,
      gemFg: stat === 'none' ? '#F2F2F2' : '#0A0A0A',
      clip: clips[stat] || clips.none,
      etat, face: etat !== 'dos', back: etat === 'dos',
      delay: this.props.delay ?? 0,
      rar: r ? r[0] : 'none', hasRar: !!r, rarName: r ? r[2] : '',
      pips: r ? Array.from({ length: r[1] }, (_, n) => n) : [],
      isDiv: !!r && r[0] === 'div', sparkle: !!r && (r[0] === 'leg' || r[0] === 'div'),
      sparks: [{ x: -4, y: 8, d: 0 }, { x: 92, y: 20, d: 0.6 }, { x: 88, y: 84, d: 1.2 }, { x: -2, y: 70, d: 1.7 }],
      i
    };
  }
}
</script>
</body>
</html>
