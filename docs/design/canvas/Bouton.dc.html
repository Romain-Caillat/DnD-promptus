<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bouton-carte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0A0A0A}
.bk{font:inherit;font-family:'Chakra Petch',system-ui,sans-serif;display:block;box-sizing:border-box;border:0;border-radius:12px;background:#EDEDED;color:#0A0A0A;text-align:left;cursor:pointer;position:relative;overflow:hidden;transform-origin:50% 100%;box-shadow:0 4px 0 #8A8A8A,0 7px 0 #5A5A5A,0 14px 24px rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s}
.bk .in{display:flex;align-items:center;gap:12px;border:1.5px solid #0A0A0A;border-radius:8px;box-sizing:border-box;height:100%}
.bk .t{display:block;font-family:'Cinzel',Georgia,serif;font-weight:800;line-height:1.05}
.bk .s{display:block;font-weight:600;color:#5A5A5A;margin-top:3px}
.bk .chev{margin-left:auto;font-family:'Cinzel',Georgia,serif;font-weight:800}
.bk .ic{display:grid;place-items:center;flex:none}
.bk.sombre{background:#141414;color:#F2F2F2;box-shadow:0 0 0 1.5px #3A3A3A,0 4px 0 #000,0 14px 24px rgba(0,0,0,.5)}
.bk.sombre .in{border-color:#5A5A5A}
.bk.sombre .s{color:#8C8C8C}
.bk::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);pointer-events:none}
.bk.sombre::after{background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent)}
.bk.vif::after{animation:bkSheen 3.6s ease-in-out infinite}
@keyframes bkSheen{0%,60%{left:-60%}85%,100%{left:120%}}
.bk:active,.bk.appuye{transform:perspective(500px) rotateX(14deg) translateY(4px);box-shadow:0 1px 0 #8A8A8A,0 2px 0 #5A5A5A,0 4px 8px rgba(0,0,0,.5)}
.bk.sombre:active,.bk.sombre.appuye{box-shadow:0 0 0 1.5px #3A3A3A,0 1px 0 #000}
.bk.demo{animation:bkPress 2.4s ease-in-out infinite}
@keyframes bkPress{0%,72%,100%{transform:none}78%,86%{transform:perspective(500px) rotateX(14deg) translateY(4px)}}
@media (prefers-reduced-motion: reduce){.bk,.bk::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<button type="button" class="bk {{cls}}" style="width: {{W}}; min-height: {{H}}px; padding: {{pad}}px">
<span class="in" style="padding: {{ip}}; gap: {{gap}}px; min-height: {{ih}}px">
<sc-if value="{{hasGem}}" hint-placeholder-val="{{ false }}"><span class="ic" style="filter: drop-shadow(0 2px 0 rgba(0,0,0,.45))"><dc-import name="Gemme" stat="{{stat}}" valeur="{{valeur}}" taille="{{gs}}" hint-size="34px,34px"></dc-import></span></sc-if>
<sc-if value="{{hasIcon}}" hint-placeholder-val="{{ false }}"><span class="ic"><svg width="{{is}}" height="{{is}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{path}}"></path></svg></span></sc-if>
<span style="flex: 1; min-width: 0"><span class="t" style="font-size: {{tfs}}px">{{titre}}</span><sc-if value="{{hasSous}}" hint-placeholder-val="{{ true }}"><span class="s" style="font-size: {{sfs}}px">{{sous}}</span></sc-if></span>
<sc-if value="{{chev}}" hint-placeholder-val="{{ true }}"><span class="chev" style="font-size: {{cfs}}px">›</span></sc-if>
</span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"titre":{"editor":"text","default":"Attaquer"},"sous":{"editor":"text","default":"Hache d’armes · 1d12+3"},"stat":{"editor":"enum","options":["none","pv","atq","ca","mag","mvt","ini"],"default":"atq"},"valeur":{"editor":"text","default":"+5"},"icon":{"editor":"enum","options":["none","sablier","epee","bouclier","fiole","envoyer","oeil","lien","stop","plus","fleche"],"default":"none"},"variante":{"editor":"enum","options":["clair","sombre"],"default":"clair"},"taille":{"editor":"enum","options":["normal","petit"],"default":"normal"},"largeur":{"editor":"int","default":280,"min":0,"max":800},"etat":{"editor":"enum","options":["repos","vif","appuye","demo"],"default":"repos"},"$preview":{"width":280,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const petit = (this.props.taille ?? 'normal') === 'petit';
    const stat = this.props.stat ?? 'none';
    const icon = this.props.icon ?? 'none';
    const sous = String(this.props.sous ?? '');
    const etat = this.props.etat ?? 'repos';
    const w = Number(this.props.largeur ?? 280);
    const paths = {
      sablier: 'M5 22h14M5 2h14M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2',
      epee: 'M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2',
      bouclier: 'M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z',
      fiole: 'M10 2v7.5L4.5 19A2 2 0 0 0 6.2 22h11.6a2 2 0 0 0 1.7-3L14 9.5V2M8.5 2h7M7 16h10',
      envoyer: 'M22 2 11 13M22 2l-7 20-4-9-9-4z',
      oeil: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      lien: 'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71',
      stop: 'M6 6h12v12H6z',
      plus: 'M12 5v14M5 12h14',
      fleche: 'M5 12h14M13 6l6 6-6 6'
    };
    return {
      cls: (this.props.variante === 'sombre' ? 'sombre ' : '') + (etat === 'repos' ? '' : etat === 'demo' ? 'vif demo' : etat),
      W: w > 0 ? w + 'px' : '100%',
      H: petit ? 36 : 56, pad: petit ? 3 : 6, ih: petit ? 30 : 44,
      ip: petit ? '0 10px' : '6px 12px', gap: petit ? 8 : 12,
      titre: this.props.titre ?? '', sous, hasSous: sous !== '' && !petit,
      stat, valeur: this.props.valeur ?? '', hasGem: stat !== 'none', gs: petit ? 22 : 34,
      hasIcon: stat === 'none' && icon !== 'none', path: paths[icon] || '', is: petit ? 16 : 24,
      tfs: petit ? 13 : 18, sfs: 11, cfs: petit ? 16 : 22, chev: !petit
    };
  }
}
</script>
</body>
</html>
