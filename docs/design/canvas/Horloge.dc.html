<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Horloge de menace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0A0A0A}
.hg{position:relative;flex:none;display:inline-block;vertical-align:middle}
.hg i{position:absolute}
.hg i.on{background:#F2F2F2;box-shadow:0 2px 0 #6E6E6E}
.hg i.off{background:#262626}
.hg i.nx{background:#262626}
.hg.on i.nx{animation:hgFill 2.4s steps(1) infinite}
@keyframes hgFill{0%,100%{background:#262626}50%{background:#F2F2F2}}
.hg b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Cinzel',Georgia,serif;font-weight:800;color:#F2F2F2}
@media (prefers-reduced-motion: reduce){.hg i{animation:none!important}}
</style>
</helmet>
<div class="hg {{onCls}}" role="img" aria-label="{{label}}" style="width: {{S}}px; height: {{S}}px">
<sc-for list="{{sq}}" as="k" hint-placeholder-count="30"><i class="{{k.cls}}" style="left: {{k.x}}px; top: {{k.y}}px; width: {{s}}px; height: {{s}}px; animation-delay: {{k.d}}s"></i></sc-for>
<sc-if value="{{texte}}" hint-placeholder-val="{{ true }}"><b style="font-size: {{fs}}px"><span>{{rempli}}/{{parts}}</span></b></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"parts":{"editor":"int","default":6,"min":2,"max":12},"rempli":{"editor":"int","default":3,"min":0,"max":12},"taille":{"editor":"int","default":112,"min":32,"max":320},"prochaine":{"editor":"boolean","default":true},"texte":{"editor":"boolean","default":true},"$preview":{"width":112,"height":112}}'>
class Component extends DCLogic {
  renderVals() {
    const parts = Number(this.props.parts ?? 6);
    const rempli = Number(this.props.rempli ?? 3);
    const S = Number(this.props.taille ?? 112);
    const next = String(this.props.prochaine ?? true) === 'true';
    // Squares per part shrink with size so the ring keeps visible gaps between parts.
    const k = S >= 90 ? 5 : S >= 56 ? 3 : 2;
    const total = parts * (k + 1);
    const s = Math.max(3, Math.round(S * 0.07));
    const R = S / 2 - s * 0.8;
    const C = S / 2;
    const sq = [];
    for (let i = 0; i < total; i++) {
      if (i % (k + 1) === k) continue;
      const a = (-90 + (i + 0.5) * 360 / total) * Math.PI / 180;
      const seg = Math.floor(i / (k + 1));
      sq.push({
        x: Math.round(C + R * Math.cos(a) - s / 2), y: Math.round(C + R * Math.sin(a) - s / 2),
        cls: seg < rempli ? 'on' : (seg === rempli && next) ? 'nx' : 'off',
        d: ((i % (k + 1)) * 0.12).toFixed(2)
      });
    }
    return {
      S, s, sq, parts, rempli, fs: Math.round(S * 0.21),
      texte: String(this.props.texte ?? true) === 'true' && S >= 56,
      onCls: next ? 'on' : '',
      label: 'Horloge : ' + rempli + ' sur ' + parts
    };
  }
}
</script>
</body>
</html>
