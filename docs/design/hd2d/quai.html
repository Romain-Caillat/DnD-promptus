<title>Quai de Port-Louis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Single dark look on purpose: a night scene, framed like a game screen. Full-bleed canvas, HUD in the corners. */
:root {
  --night: #07090c;
  --panel: rgba(12, 18, 28, 0.78);
  --gold: #e0a650;
  --gold-soft: #8a6a3a;
  --text: #efe6d2;
  --muted: #a99f8a;
  --blood: #e2564a;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --pixel: "Pixelify Sans", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--pixel); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; pointer-events: none; }
#card { inset: 0; display: grid; place-items: center; text-align: center; transition: opacity 1.2s ease; }
#card.gone { opacity: 0; }
#card .inner { display: grid; gap: 10px; padding-inline: 16px; }
#card .world { font-family: var(--display); letter-spacing: .3em; text-transform: uppercase; font-size: clamp(11px, 1.6vw, 14px); color: var(--gold); }
#card h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(28px, 6vw, 60px); text-wrap: balance; text-shadow: 0 0 24px rgba(224,166,80,.35), 0 2px 0 #000; }
#card .rule { height: 1px; width: min(320px, 70vw); margin: 4px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
#card .where { color: var(--muted); font-size: clamp(13px, 1.8vw, 16px); }
#caption { left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--gold-soft); outline: 1px solid rgba(0,0,0,.6); padding: 10px 16px; display: grid; gap: 4px; transition: opacity .3s; }
#caption.empty { opacity: 0; }
#caption .who { font-family: var(--display); color: var(--gold); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
#caption .what { font-size: 18px; }
#caption .roll { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
#tools { top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
#tools button { font: 600 13px var(--pixel); color: var(--text); background: var(--panel); border: 1px solid var(--gold-soft); padding: 6px 10px; cursor: pointer; }
#tools button:hover { border-color: var(--gold); }
#tools button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#tag { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; font-size: 12px; color: var(--muted); max-width: 46vw; }
#tag b { font-family: var(--display); color: var(--gold); font-weight: 500; letter-spacing: .1em; display: block; font-size: 13px; }
#pops { inset: 0; }
.pop { position: absolute; transform: translate(-50%, -100%); font: 600 30px var(--pixel); color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); white-space: nowrap; }
.pop.dmg { color: #ffd9a0; }
.pop.miss { color: #b9c4cf; font-size: 20px; }
.say { position: absolute; transform: translate(-50%, -100%); max-width: min(300px, 70vw); background: #efe6d2; color: #1b1410; font: 600 15px var(--pixel); padding: 8px 12px; border: 2px solid #1b1410; }
.say::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 6px solid transparent; border-top-color: #1b1410; transform: translateX(-50%); }
</style>

<div id="stage"></div>
<div id="tag" class="hud"><b>Prototype HD-2D</b>Acte I, scène 4 · sprites dessinés en code</div>
<div id="tools" class="hud">
  <button id="btn-mode" type="button">Vue : HD-2D</button>
  <button id="btn-pause" type="button">Pause</button>
  <button id="btn-replay" type="button">Rejouer</button>
</div>
<div id="pops" class="hud"></div>
<div id="caption" class="hud empty"><span class="who" id="cap-who"></span><span class="what" id="cap-what"></span><span class="roll" id="cap-roll"></span></div>
<div id="card" class="hud"><div class="inner">
  <span class="world">Corsaires de la Couronne</span>
  <h1>La bagarre du quai</h1>
  <span class="rule"></span>
  <span class="where">Port-Louis, 1718 · nuit et brouillard</span>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
// ---------------------------------------------------------------- helpers
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function shade(c, k) { const [r, g, b] = hex(c); const f = v => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function texture(c, rx = 1, ry = 1) { const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.encoding = THREE.sRGBEncoding; return t; }
// grid cell (x right, y down to the water) -> world
const W = (gx, gy) => [gx - 12 + 0.5, gy - 8 + 0.5];

// ---------------------------------------------------------------- pixel textures (16 px per tile)
function cobbles() {
  const [c, g] = canvas(64, 64), r = rng(7);
  g.fillStyle = '#2b2925'; g.fillRect(0, 0, 64, 64);
  for (let y = 0; y < 64; y += 6) for (let x = (y / 6 % 2) * 4; x < 68; x += 8) {
    const base = ['#5d5850', '#56524a', '#625c52', '#4f4b45'][Math.floor(r() * 4)];
    g.fillStyle = base; g.fillRect(x + 1, y + 1, 6, 4);
    g.fillStyle = shade(base, .18); g.fillRect(x + 1, y + 1, 5, 1);
    g.fillStyle = shade(base, -.3); g.fillRect(x + 2, y + 4, 5, 1);
    if (r() < .15) { g.fillStyle = '#4d5a3c'; g.fillRect(x + 6, y + 5, 2, 1); }
  }
  return c;
}
function planks(base = '#6b4a2e', w = 64) {
  const [c, g] = canvas(w, 64), r = rng(3);
  for (let y = 0; y < 64; y += 4) {
    const b = shade(base, (r() - .5) * .25);
    g.fillStyle = b; g.fillRect(0, y, w, 4);
    g.fillStyle = shade(base, -.45); g.fillRect(0, y + 3, w, 1);
    g.fillStyle = shade(base, .12); g.fillRect(0, y, w, 1);
    const cut = Math.floor(r() * w); g.fillStyle = shade(base, -.5); g.fillRect(cut, y, 1, 3);
    for (let i = 0; i < 3; i++) { g.fillStyle = shade(b, -.15); g.fillRect(Math.floor(r() * w), y + 1 + Math.floor(r() * 2), 3 + Math.floor(r() * 5), 1); }
  }
  return c;
}
function stones(face = '#5b5448', joint = '#2f2b25') {
  const [c, g] = canvas(64, 64), r = rng(11);
  g.fillStyle = joint; g.fillRect(0, 0, 64, 64);
  for (let y = 0; y < 64; y += 8) for (let x = (y / 8 % 2) * 6 - 6; x < 64; x += 12) {
    const b = shade(face, (r() - .5) * .22); g.fillStyle = b; g.fillRect(x + 1, y + 1, 11, 7);
    g.fillStyle = shade(b, .15); g.fillRect(x + 1, y + 1, 11, 1); g.fillStyle = shade(b, -.25); g.fillRect(x + 1, y + 7, 11, 1);
  }
  return c;
}
function slates() {
  const [c, g] = canvas(64, 64), r = rng(5);
  for (let y = 0; y < 64; y += 5) for (let x = (y / 5 % 2) * 4 - 4; x < 64; x += 8) {
    const b = shade('#343a44', (r() - .5) * .3); g.fillStyle = b; g.fillRect(x, y, 8, 5);
    g.fillStyle = shade(b, -.5); g.fillRect(x, y + 4, 8, 1); g.fillRect(x, y, 1, 5);
  }
  return c;
}
function water() {
  const [c, g] = canvas(64, 64), r = rng(9);
  g.fillStyle = '#10232f'; g.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 70; i++) { g.fillStyle = r() < .7 ? '#1b3a4c' : '#2c5268'; g.fillRect(Math.floor(r() * 64), Math.floor(r() * 64), 2 + Math.floor(r() * 6), 1); }
  return c;
}
function crate() {
  const [c, g] = canvas(16, 16);
  g.drawImage(planks('#8a6239', 16), 0, 0, 16, 16, 0, 0, 16, 16);
  g.fillStyle = '#4f3720'; g.fillRect(0, 0, 16, 2); g.fillRect(0, 14, 16, 2); g.fillRect(0, 0, 2, 16); g.fillRect(14, 0, 2, 16);
  for (let i = 2; i < 14; i++) g.fillRect(i, i, 2, 1);
  return c;
}
function windowTex(lit) {
  const [c, g] = canvas(8, 10);
  g.fillStyle = '#1d1712'; g.fillRect(0, 0, 8, 10);
  g.fillStyle = lit ? '#ffc070' : '#1f2b38'; g.fillRect(1, 1, 6, 8);
  g.fillStyle = '#1d1712'; g.fillRect(3, 1, 1, 8); g.fillRect(1, 4, 6, 1);
  return c;
}

// ---------------------------------------------------------------- sprite painter (48x48 frames, facing right, feet at y=44)
const SKIN = { hale: '#c58a5c', brun: '#8d5a3b', clair: '#e3b48d', pale: '#edc9a8' };
const LOOKS = {
  bretteur: { skin: 'hale', hair: '#5a3a22', style: 'catogan', beard: 'bouc', hat: 'tricorne', hatC: '#23202a', hatA: '#e0b040', coat: '#a8322d', sleeve: '#d8d0bf', accent: '#23202a', pants: '#3a2c22', body: 'svelte', weapon: 'sabre' },
  canonnier: { skin: 'brun', hair: '#1e1a1a', style: 'rase', beard: 'courte', hat: 'bandana', hatC: '#a8322d', hatA: '#e2ddd0', coat: '#6b6b70', sleeve: 'skin', accent: '#6e4a2c', pants: '#2e2a26', body: 'robuste', weapon: 'pistolet' },
  flibustier: { skin: 'hale', hair: '#1e1a1a', style: 'longue', beard: 'longue', hat: 'chapeau', hatC: '#23202a', hatA: '#a8322d', coat: '#3b6b3f', sleeve: '#3b6b3f', accent: '#c08a2e', pants: '#2e2a26', body: 'robuste', weapon: 'hache', skirt: true },
  gueule: { skin: 'hale', hair: '#1e1a1a', style: 'catogan', beard: null, hat: null, coat: '#6e4a2c', sleeve: 'skin', chest: true, accent: '#a8322d', pants: '#2b2420', body: 'robuste', weapon: 'sabre', scar: true },
  marin: { skin: 'hale', hair: '#5a3a22', style: 'court', beard: 'courte', hat: 'bonnet', hatC: '#a8322d', hatA: '#e2ddd0', coat: '#e2ddd0', sleeve: '#e2ddd0', accent: '#6e4a2c', pants: '#3d4a5a', body: 'svelte', weapon: 'coutelas' },
};
const FRAMES = ['idle0', 'idle1', 'walk0', 'walk1', 'walk2', 'walk3', 'windup', 'strike', 'aim', 'hurt', 'down'];
const POSE = {
  idle0: { bob: 0, la: 1, lb: -1, af: 1.2, ab: 1.8, wa: -.8 }, idle1: { bob: 1, la: 1, lb: -1, af: 1.25, ab: 1.85, wa: -.75 },
  walk0: { bob: 0, la: 3, lb: -3, af: .9, ab: 2.2, wa: -.6 }, walk1: { bob: 1, la: 1, lb: -1, af: 1.3, ab: 1.8, wa: -.8 },
  walk2: { bob: 0, la: -3, lb: 3, af: 1.8, ab: 1.3, wa: -1 }, walk3: { bob: 1, la: -1, lb: 1, af: 1.4, ab: 1.6, wa: -.8 },
  windup: { bob: 0, la: 3, lb: -3, af: -2.3, ab: 2.4, wa: -2.5, lean: -1, crouch: 1 },
  strike: { bob: 0, la: 5, lb: -4, af: .25, ab: 2.6, wa: .5, lean: 3, crouch: 2 },
  aim: { bob: 0, la: 2, lb: -2, af: 0, ab: 1.9, wa: 0, lean: 1 },
  hurt: { bob: 0, la: -2, lb: 2, af: 2.4, ab: 2.6, wa: 2.2, lean: -3, crouch: 1 },
};
function paint(L) {
  const N = FRAMES.length, [atlas, ag] = canvas(48 * N, 48);
  const skin = SKIN[L.skin], sleeve = L.sleeve === 'skin' ? skin : L.sleeve;
  const gun = L.weapon === 'pistolet';
  FRAMES.forEach((name, i) => {
    const [fc, g] = canvas(48, 48);
    const P = Object.assign({ lean: 0, crouch: 0 }, POSE[name === 'down' ? 'hurt' : name]);
    if (gun && name.startsWith('idle')) { P.wa = .5; }
    const p = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), w, h); };
    const limb = (x, y, a, len, w, col) => { for (let k = 0; k < len; k++) p(x + Math.cos(a) * k - (w >> 1), y + Math.sin(a) * k - (w >> 1), w, w, col); return [x + Math.cos(a) * len, y + Math.sin(a) * len]; };
    const wide = L.body === 'robuste', tw = wide ? 10 : 8;
    const hipY = 34 + P.crouch, cx = 22 + P.lean, top = hipY - 11 + P.bob, tx = cx - (tw >> 1);
    // back arm, legs
    limb(tx + 2, top + 2, P.ab, 8, 2, shade(sleeve === skin ? skin : sleeve, -.3));
    const leg = (hx, off, dark) => { for (let y = hipY; y <= 44; y++) { const t = (y - hipY) / (44 - hipY); p(hx + off * t, y, 3, 1, y > 41 ? '#21160f' : (dark ? shade(L.pants, -.3) : L.pants)); } };
    leg(cx - 3, P.lb, true); leg(cx, P.la, false);
    // torso
    if (L.chest) { p(tx, top, tw, hipY - top, skin); p(tx, top, 3, hipY - top, L.coat); p(tx + tw - 2, top + 1, 2, hipY - top - 1, L.coat); }
    else { p(tx, top, tw, hipY - top, L.coat); p(tx + tw - 3, top, 2, 3, sleeve === skin ? skin : '#d8d0bf'); }
    if (L.skirt) { p(tx - 1, hipY - 1, tw + 2, 6, L.coat); p(cx, hipY + 1, 1, 4, shade(L.coat, -.4)); }
    p(tx, hipY - 2, tw, 2, L.accent); p(tx + tw - 3, hipY - 2, 2, 2, '#e0b040');
    // head
    const hx = cx - 3, hy = top - 8;
    p(hx, hy, 7, 8, skin); p(hx + 7, hy + 3, 1, 2, skin); p(hx + 5, hy + 3, 1, 1, '#140c0a');
    p(hx, hy - 1, 7, 2, L.hair); p(hx, hy, 3, 5, L.hair);
    if (L.style === 'catogan') p(hx - 2, hy + 4, 2, 5, L.hair);
    if (L.style === 'longue') p(hx - 1, hy + 1, 3, 9, L.hair);
    if (L.beard === 'bouc') p(hx + 5, hy + 6, 2, 2, L.hair);
    if (L.beard === 'courte') p(hx + 3, hy + 5, 5, 3, L.hair);
    if (L.beard === 'longue') p(hx + 3, hy + 5, 5, 6, L.hair);
    if (L.scar) { p(hx + 4, hy + 1, 1, 1, '#d23a2a'); p(hx + 5, hy + 2, 1, 1, '#d23a2a'); p(hx + 6, hy + 4, 1, 1, '#d23a2a'); }
    if (L.hat === 'tricorne') { p(hx - 2, hy - 2, 12, 2, L.hatC); p(hx, hy - 4, 8, 2, L.hatC); p(hx + 1, hy - 5, 5, 1, L.hatC); p(hx - 2, hy - 1, 12, 1, L.hatA); }
    if (L.hat === 'bandana') { p(hx, hy - 2, 8, 3, L.hatC); p(hx - 2, hy + 1, 2, 3, L.hatC); p(hx + 2, hy - 1, 1, 1, L.hatA); p(hx + 5, hy - 2, 1, 1, L.hatA); }
    if (L.hat === 'chapeau') { p(hx - 3, hy - 1, 13, 1, L.hatC); p(hx, hy - 5, 7, 4, L.hatC); p(hx, hy - 2, 7, 1, L.hatA); p(hx - 2, hy - 7, 2, 4, '#e8e4dc'); }
    if (L.hat === 'bonnet') { p(hx - 1, hy - 3, 8, 3, L.hatC); p(hx - 3, hy - 2, 2, 3, L.hatC); p(hx - 1, hy, 8, 1, L.hatA); }
    // front arm + weapon
    const [ex, ey] = limb(tx + tw - 3, top + 2, P.af, 8, 2, sleeve);
    p(ex - 1, ey - 1, 2, 2, skin);
    const w = L.weapon, a = P.wa;
    if (w === 'sabre' || w === 'coutelas') {
      const n = w === 'sabre' ? 14 : 8;
      limb(ex, ey, a + Math.PI, 2, 1, '#4f3720');
      limb(ex - Math.sin(a) * 2, ey + Math.cos(a) * 2, a - Math.PI / 2, 4, 1, '#e0b040');
      limb(ex, ey, a, n, 1, '#e6ecf1'); limb(ex + Math.sin(a), ey - Math.cos(a), a, n - 2, 1, '#93a0ad');
    } else if (w === 'pistolet') { limb(ex, ey, a, 7, 2, '#34343c'); limb(ex, ey, a + 1.9, 3, 2, '#6b4a2e'); }
    else if (w === 'hache') { limb(ex, ey, a + Math.PI, 3, 1, '#6b4a2e'); const [hx2, hy2] = limb(ex, ey, a, 10, 1, '#6b4a2e'); limb(hx2, hy2, a + Math.PI / 2, 4, 3, '#b8c0c8'); }
    // pixel outline and rim light
    const img = g.getImageData(0, 0, 48, 48), d = img.data, out = new Uint8ClampedArray(d);
    const op = (x, y) => x >= 0 && y >= 0 && x < 48 && y < 48 && d[(y * 48 + x) * 4 + 3] > 0;
    for (let y = 0; y < 48; y++) for (let x = 0; x < 48; x++) {
      const k = (y * 48 + x) * 4;
      if (!op(x, y)) { if (op(x + 1, y) || op(x - 1, y) || op(x, y + 1) || op(x, y - 1)) { out[k] = 18; out[k + 1] = 12; out[k + 2] = 16; out[k + 3] = 255; } }
      else if (!op(x - 1, y) || !op(x, y - 1)) { for (let j = 0; j < 3; j++) out[k + j] = Math.min(255, d[k + j] + 38); }
      else if (!op(x + 1, y)) { for (let j = 0; j < 3; j++) out[k + j] = d[k + j] * .7; }
    }
    g.putImageData(new ImageData(out, 48, 48), 0, 0);
    if (name === 'down') { ag.save(); ag.translate(48 * i + 34, 46); ag.rotate(-Math.PI / 2); ag.drawImage(fc, -22, -44); ag.restore(); }
    else ag.drawImage(fc, 48 * i, 0);
  });
  return atlas;
}

// ---------------------------------------------------------------- renderer, scene, camera
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FOG = new THREE.Color('#1a2633');
scene.background = FOG.clone();
scene.fog = new THREE.FogExp2(FOG, 0.05);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);

const hemi = new THREE.HemisphereLight('#4a6488', '#1c140e', 0.55); scene.add(hemi);
const moon = new THREE.DirectionalLight('#a8bfe8', 0.7);
moon.position.set(-9, 16, 14); moon.target.position.set(-2, 0, -2);
moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -16, right: 16, top: 14, bottom: -14, near: 1, far: 50 });
moon.shadow.bias = -0.0008; moon.shadow.normalBias = 0.03;
scene.add(moon, moon.target);

function mat(c, rx, ry, opts = {}) { return new THREE.MeshStandardMaterial(Object.assign({ map: texture(c, rx, ry), roughness: .85, metalness: 0 }, opts)); }
function box(w, h, d, m, x, y, z, parent = scene) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; parent.add(b); return b; }

// ---------------------------------------------------------------- the quay (map quai-port-louis)
const stoneC = stones(), cobC = cobbles();
box(44, 0.9, 6, [mat(stoneC, 1, 1), mat(stoneC, 1, 1), mat(cobC, 11, 1.5, { roughness: .55 }), mat(stoneC, 1, 1), mat(stoneC, 11, .25), mat(stoneC, 1, 1)], 0, -0.45, -1);
// puddles from the grid's ',' cells
const puddle = new THREE.MeshStandardMaterial({ color: '#1e2c36', roughness: .05, metalness: .3 });
[[11, 6], [12, 6], [15, 8], [16, 8], [4, 9]].forEach(([gx, gy]) => { const [x, z] = W(gx, gy); const m = new THREE.Mesh(new THREE.CircleGeometry(.48, 7), puddle); m.rotation.x = -Math.PI / 2; m.position.set(x, .006, z); m.receiveShadow = true; scene.add(m); });
// warehouses: Kerjean, douanes, chantier naval (rows 0-3), plus fillers past the map edges

function warehouse(x0, x1, h, door, open) {

// feet anchor: lowest opaque row, centre of the opaque pixels just above it
function feetOf(img) {
  const [c, g] = canvas(img.width, img.height); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, img.width, img.height).data; let maxY = 0, sx = 0, n = 0;
  for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) if (d[(y * img.width + x) * 4 + 3] > 0) maxY = y;
  for (let y = maxY - 3; y <= maxY; y++) for (let x = 0; x < img.width; x++) if (d[(y * img.width + x) * 4 + 3] > 0) { sx += x; n++; }

// one 128 px cell per frame, feet at (64, 124); sequences anchored on their first frame

    else { const [img, ax, ay, dy] = cell; g.drawImage(img, Math.round(128 * i + 64 - ax), Math.round(124 - ay + dy)); }

  const img = PLIMG[key], h = w * img.height / img.width;

  if (glow) { m.emissive.set('#ffffff'); m.emissiveMap = texture(glowMask(img)); m.emissiveIntensity = glow; }
  const geo = new THREE.PlaneGeometry(w, h); geo.translate(0, h / 2, 0);
  const mesh = new THREE.Mesh(geo, m); mesh.position.set(x, y, z); mesh.castShadow = !face; mesh.receiveShadow = true; mesh.rotation.order = 'YXZ';
  scene.add(mesh); if (!face) billboards.push(mesh); return mesh;
}
function buildPL() {
  const I = PLIMG;
  PLA.gueule = plAtlas(I.gr_east, { windup: [0, 1, 2, 3].map(i => I['gr_slash_' + i]), strike: [4, 5, 6].map(i => I['gr_slash_' + i]) });
  PLA.marin = plAtlas(I.m_east, { windup: [I.m_stab_0], strike: [I.m_stab_1, I.m_stab_2] });
  // façade of the customs warehouse, straight on, glowing windows
  plProp('facade', 6.4, -1.5, 0, -3.95, 1.8, true);
  // crate face, straight on, cropped to its opaque bounds, on every face of the 3D crates
  { const img = I.crate_face, [c0, g0] = canvas(img.width, img.height); g0.drawImage(img, 0, 0);
    const d = g0.getImageData(0, 0, img.width, img.height).data; let x0 = img.width, y0 = img.height, x1 = 0, y1 = 0;
    for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) if (d[(y * img.width + x) * 4 + 3] > 128) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const [cf, gf] = canvas(x1 - x0 + 1, y1 - y0 + 1); gf.drawImage(img, -x0, -y0);
    crateM.map = texture(cf); crateM.needsUpdate = true; }
  // wall lanterns replace the glowing boxes
  wallLanterns.forEach(gl => { gl.visible = false; plProp('lantern', .62, gl.position.x, gl.position.y - .55, gl.position.z + .05, 2.6, true); });
}

// ---------------------------------------------------------------- actors
const N = FRAMES.length, actors = {};
class Actor {
  constructor(id, look, name, face) {
    this.name = name; this.face = face; this.phase = Math.random() * 3;
    const pl = PLA[look];
    this.names = pl ? pl.names : FRAMES; this.seq = pl ? pl.seq : null;
    const cell = pl ? 128 : 48, ppu = pl ? 40 : 20, feet = pl ? 124 : 44;
    this.tex = texture(pl ? pl.canvas : paint(LOOKS[look])); this.tex.wrapS = this.tex.wrapT = THREE.ClampToEdgeWrapping;
    this.mat = new THREE.MeshLambertMaterial({ map: this.tex, alphaTest: .5, side: THREE.DoubleSide, emissive: '#000000' });
    const geo = new THREE.PlaneGeometry(cell / ppu, cell / ppu); geo.translate(0, cell / ppu / 2 - (cell - feet) / ppu, 0);
    this.mesh = new THREE.Mesh(geo, this.mat); this.mesh.castShadow = true; this.mesh.rotation.order = 'YXZ';
    this.root = new THREE.Group(); this.root.add(this.mesh); scene.add(this.root);
    this.headY = pl ? 1.9 : 2.1;
    this.pose = null; this.moving = false; this.down = false; actors[id] = this;
  }
  set pose(v) { this._pose = v; this.poseT = T; }
  get pose() { return this._pose; }
  at(gx, gy, y = 0) { const [x, z] = W(gx, gy); this.root.position.set(x, y, z); return this; }
  frame(name) { const n = this.names.length, i = Math.max(0, this.names.indexOf(name)); if (this.face > 0) { this.tex.repeat.set(1 / n, 1); this.tex.offset.set(i / n, 0); } else { this.tex.repeat.set(-1 / n, 1); this.tex.offset.set((i + 1) / n, 0); } }
  update() {
    if (this.seq) {
      const s = this._pose && this.seq[this._pose];
      if (this.down) this.frame('down');
      else if (s) this.frame(s[Math.min(s.length - 1, Math.floor((T - this.poseT) * 11))]);
      else if (this.moving) this.frame(Math.floor(T * 7) % 2 ? 'hop' : 'idle');
      else this.frame(Math.floor(T * 1.8 + this.phase) % 2 ? 'breath' : 'idle');
    }
    else if (this.down) this.frame('down');
    else if (this.pose) this.frame(this.pose);
    else if (this.moving) this.frame('walk' + (Math.floor(T * 9) % 4));
    else this.frame('idle' + (Math.floor(T * 1.8 + this.phase) % 2));
    this.mesh.rotation.y = camYaw; this.mesh.rotation.x = -camPitch * .45;
  }
  head() { return this.root.position.clone().add(new THREE.Vector3(0, this.headY, 0)); }
}

// ---------------------------------------------------------------- post-processing: bloom, tilt-shift, grade
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
const composer = new THREE.EffectComposer(renderer, rt);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1, 1), .85, .55, .8); composer.addPass(bloom);
const tiltShader = { uniforms: { tDiffuse: { value: null }, focus: { value: .45 }, dir: { value: new THREE.Vector2(1, 0) }, res: { value: new THREE.Vector2(1, 1) }, amount: { value: 7 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float focus, amount; uniform vec2 dir, res; varying vec2 vUv;
  void main(){ float dy = vUv.y - focus; float d = clamp((abs(dy) - .16) / .5, 0., 1.) * (dy > 0. ? 1.2 : .8);
    float r = d * d * amount; vec4 s = vec4(0.); float t = 0.;
    for (int i = -6; i <= 6; i++) { float w = exp(-float(i*i) / 18.); s += texture2D(tDiffuse, vUv + dir * float(i) * r / res) * w; t += w; }
    gl_FragColor = s / t; }` };
const tiltH = new THREE.ShaderPass(tiltShader), tiltV = new THREE.ShaderPass(tiltShader); tiltV.uniforms.dir.value.set(0, 1);
composer.addPass(tiltH); composer.addPass(tiltV);
const grade = new THREE.ShaderPass({ uniforms: { tDiffuse: { value: null }, time: { value: 0 }, flash: { value: 0 } },
  vertexShader: tiltShader.vertexShader,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time, flash; varying vec2 vUv;
  vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.); }
  float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
  void main(){ vec3 c = aces(texture2D(tDiffuse, vUv).rgb * 1.35);
    float l = dot(c, vec3(.299,.587,.114));
    c = mix(c, c * vec3(.82,.95,1.15), (1. - l) * .4); c = mix(c, c * vec3(1.1,1.,.86), l * .35);
    c *= mix(.5, 1., smoothstep(.85, .3, length((vUv - .5) * vec2(1.1, 1.))));
    c = pow(c, vec3(1./2.2)); c += (h(vUv * 900. + time) - .5) * .03; c += flash;
    gl_FragColor = vec4(c, 1.); }` });
composer.addPass(grade);

// ---------------------------------------------------------------- camera rig
let camYaw = 0, camPitch = .6, shake = 0;
const cam = { pos: new THREE.Vector3(9, 5, 17), look: new THREE.Vector3(3, 1, 2) }, want = { pos: cam.pos.clone(), look: cam.look.clone() };
function shot(x, z, dist = 10, height = 7, side = -1.5) { want.look.set(x, .7, z - .3); want.pos.set(x + side, height, z + dist); }
let hd = true;

// ---------------------------------------------------------------- timeline (game time, pausable)
let T = 0, paused = false, gen = 0, timers = [], tweens = [];
class Cancel extends Error {}
const guard = g => { if (g !== gen) throw new Cancel(); };
const wait = s => { const g = gen; return new Promise(r => timers.push({ at: T + s, r })).then(() => guard(g)); };
const ease = p => p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;
const tween = (dur, fn, e = ease) => { const g = gen; return new Promise(r => tweens.push({ t0: T, dur, fn, e, r })).then(() => guard(g)); };
async function walk(a, gx, gy, speed = 2.6) {
  const [x, z] = W(gx, gy), from = a.root.position.clone(), to = new THREE.Vector3(x, from.y, z);
  if (Math.abs(to.x - from.x) > .05) a.face = to.x > from.x ? 1 : -1;
  a.moving = true; await tween(from.distanceTo(to) / speed, p => a.root.position.lerpVectors(from, to, p), p => p); a.moving = false;
}
function hit(a) { a.mat.emissive.set('#ffffff'); tween(.12, () => {}).then(() => a.mat.emissive.set('#000000')).catch(() => {}); const x0 = a.root.position.x; tween(.3, p => { a.root.position.x = x0 + Math.sin(p * 30) * .06 * (1 - p); }, q => q).catch(() => {}); shake = reduced ? 0 : .12; }

// ---------------------------------------------------------------- HUD
const $ = id => document.getElementById(id), pops = $('pops'), live = [];
function caption(who, what, roll = '') { $('cap-who').textContent = who; $('cap-what').textContent = what; $('cap-roll').textContent = roll; $('caption').classList.toggle('empty', !who); }
function pop(a, text, cls, life = 1.3) { const el = document.createElement('div'); el.className = cls; el.textContent = text; pops.appendChild(el); live.push({ el, a, t0: T, life, rise: cls.includes('pop') }); }
function project(v) { const p = v.clone().project(camera); return [(p.x + 1) / 2 * innerWidth, (1 - p.y) / 2 * innerHeight]; }

// ---------------------------------------------------------------- slash VFX
const [slC, sg] = canvas(32, 32); sg.strokeStyle = '#fff6e0'; sg.lineWidth = 3; sg.beginPath(); sg.arc(10, 16, 13, -1.2, 1.2); sg.stroke(); sg.strokeStyle = '#ffd27a'; sg.lineWidth = 1; sg.beginPath(); sg.arc(8, 16, 13, -1, 1); sg.stroke();
const slashT = texture(slC);
function slash(a, b) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: slashT, color: '#ffe2b0', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.material.rotation = a.face > 0 ? -.4 : Math.PI + .4; s.position.copy(b.root.position).add(new THREE.Vector3(-a.face * .2, 1.1, .1)); scene.add(s);
  const l = new THREE.PointLight('#ffd9a0', 3, 4, 2); l.position.copy(s.position); scene.add(l);
  tween(.35, p => { s.scale.setScalar(1 + p * 1.2); s.material.opacity = 1 - p; l.intensity = 3 * (1 - p); }).then(() => { scene.remove(s, l); }).catch(() => scene.remove(s, l));
}
function muzzle(a, b) {
  const start = a.root.position.clone().add(new THREE.Vector3(a.face * .55, 1.05, 0)), end = b.root.position.clone().add(new THREE.Vector3(0, 1, 0));
  const l = new THREE.PointLight('#ffcf80', 6, 7, 2); l.position.copy(start); scene.add(l);
  const flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: fogT, color: '#fff0c0', blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })); flash.position.copy(start); flash.scale.setScalar(1.2); scene.add(flash);
  const tracer = new THREE.Line(new THREE.BufferGeometry().setFromPoints([start, end]), new THREE.LineBasicMaterial({ color: '#ffe9b0', transparent: true }));
  scene.add(tracer); grade.uniforms.flash.value = .08;
  const smoke = [];
  for (let i = 0; i < 6; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: fogT, color: '#8a8f96', transparent: true, opacity: .5, depthWrite: false })); s.position.copy(start); s.userData.v = new THREE.Vector3(a.face * Math.random() * .6, .3 + Math.random() * .4, (Math.random() - .5) * .4); scene.add(s); smoke.push(s); }
  tween(1.4, p => { l.intensity = 6 * Math.max(0, 1 - p * 6); flash.material.opacity = Math.max(0, 1 - p * 5); tracer.material.opacity = Math.max(0, 1 - p * 8); grade.uniforms.flash.value = .08 * Math.max(0, 1 - p * 8);
    smoke.forEach(s => { s.position.addScaledVector(s.userData.v, .016); s.scale.setScalar(.4 + p * 1.6); s.material.opacity = .45 * (1 - p); }); }, q => q)
    .then(() => scene.remove(l, flash, tracer, ...smoke)).catch(() => scene.remove(l, flash, tracer, ...smoke));
}

// ---------------------------------------------------------------- the scene
function reset() {
  gen++; timers = []; tweens = []; T = 0; live.splice(0).forEach(p => p.el.remove()); caption('');
  Object.values(actors).forEach(a => scene.remove(a.root)); for (const k in actors) delete actors[k];
  new Actor('bretteur', 'bretteur', 'Bretteur', 1).at(-3, 7);
  new Actor('flibustier', 'flibustier', 'Flibustier', 1).at(-4, 5);
  new Actor('canonnier', 'canonnier', 'Canonnier', 1).at(-5, 6);
  new Actor('gueule', 'gueule', 'Gueule-Rouge', -1).at(13, 6);
  new Actor('marin5', 'marin', 'Marin 5', -1).at(9, 7);
  new Actor('marin3', 'marin', 'Marin 3', -1).at(12, 8);
  new Actor('marin1', 'marin', 'Marin 1', -1).at(10, 5);
  ['gueule', 'marin5', 'marin3', 'marin1'].forEach(id => { actors[id].root.visible = false; });
  cam.pos.set(9, 4.5, 17); cam.look.set(3, 1.2, 2); want.pos.copy(cam.pos); want.look.copy(cam.look);
  $('card').classList.remove('gone');
  run().catch(e => { if (!(e instanceof Cancel)) console.error(e); });
}
async function reveal(id) { const a = actors[id]; a.root.visible = true; a.mat.transparent = true; await tween(.6, p => { a.mat.opacity = p; }); a.mat.transparent = false; }
async function say(a, text, s = 2.6) { const el = { a }; pop(a, text, 'say', s); await wait(s); }
async function run() {
  const A = actors;
  shot(-2, 0, 11, 6.5, 6); await wait(2.4);
  $('card').classList.add('gone');
  shot(-6, -.5, 10, 7.5, -1.5);
  await Promise.all([walk(A.bretteur, 5, 7), walk(A.flibustier, 6, 4), walk(A.canonnier, 4, 5)]);
  await wait(.4);
  shot(-.5, -1.5, 9, 6.5, 0);
  await Promise.all(['marin5', 'marin3', 'marin1'].map(reveal)); await reveal('gueule');
  await say(A.gueule, 'Les lettres de marque, ou je vous jette tous au bassin !', 3);
  // Bretteur — Estocade (3 dégâts, précision 2), vs a sailor (CA 10, 4 PV)
  shot(-2.5, -.5, 7, 5, -1);
  caption('Bretteur', 'Estocade → Marin 5', ''); await walk(A.bretteur, 8, 7); await wait(.3);
  A.bretteur.pose = 'windup'; await wait(.35); A.bretteur.pose = 'strike'; slash(A.bretteur, A.marin5); hit(A.marin5); A.marin5.pose = 'hurt';
  caption('Bretteur', 'Estocade → Marin 5', 'd20 12 + FOR 1 = 13 contre CA 10 · touché'); pop(A.marin5, '3', 'pop dmg');
  await wait(.5); A.bretteur.pose = null; A.marin5.pose = null; await wait(.8);
  // Marin 5 — Coutelas, riposte
  caption('Marin 5', 'Coutelas → Bretteur', ''); A.marin5.pose = 'windup'; await wait(.35); A.marin5.pose = 'strike'; slash(A.marin5, A.bretteur); hit(A.bretteur); A.bretteur.pose = 'hurt';
  caption('Marin 5', 'Coutelas → Bretteur', 'd20 14 + FOR 0 = 14 contre CA 12 · touché · 1d4+1 = 3'); pop(A.bretteur, '3', 'pop dmg');
  await wait(.5); A.marin5.pose = null; A.bretteur.pose = null; await wait(1.1);
  // Canonnier — Tir de silex (4 dégâts, recharge 1 tour)
  shot(-3.5, -1.5, 9, 6, -2);
  caption('Canonnier', 'Tir de silex → Marin 3', ''); A.canonnier.pose = 'aim'; await wait(.7);
  muzzle(A.canonnier, A.marin3); hit(A.marin3); pop(A.marin3, '4', 'pop dmg');
  caption('Canonnier', 'Tir de silex → Marin 3', 'd20 15 + INT 2 = 17 contre CA 10 · touché · Marin 3 à terre · recharge 1 tour');
  await wait(.25); A.marin3.down = true; await wait(1.4); A.canonnier.pose = null;
  // Gueule-Rouge — Sabre d'abordage on whoever looks strongest
  shot(-4, -2, 7.5, 5.5, 1);
  caption('Gueule-Rouge', 'Sabre d\'abordage → Flibustier', 'Il vise celui qui a l\'air le plus fort'); await walk(A.gueule, 7, 4, 3.2); await wait(.2);
  A.gueule.pose = 'windup'; await wait(.4); A.gueule.pose = 'strike'; slash(A.gueule, A.flibustier); hit(A.flibustier); A.flibustier.pose = 'hurt';
  caption('Gueule-Rouge', 'Sabre d\'abordage → Flibustier', 'd20 13 + FOR 2 = 15 contre CA 9 · touché · 1d6+2 = 7'); pop(A.flibustier, '7', 'pop dmg');
  await wait(.5); A.gueule.pose = null; A.flibustier.pose = null; await wait(1.2);
  // Flibustier — Coup de hache, missed
  caption('Flibustier', 'Coup de hache → Gueule-Rouge', ''); A.flibustier.pose = 'windup'; await wait(.4); A.flibustier.pose = 'strike'; await wait(.15);
  pop(A.gueule, 'Raté', 'pop miss'); caption('Flibustier', 'Coup de hache → Gueule-Rouge', 'd20 6 + FOR 2 = 8 contre CA 12 · raté');
  await wait(.6); A.flibustier.pose = null;
  await say(A.gueule, 'Ha ! Tu tiens ta hache comme une rame.', 2.4);
  caption(''); shot(-1, -1, 12, 7.5, 3); await wait(2.5);
  reset();
}

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h; camera.fov = w / h < 1 ? 60 : 38; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio(); tiltH.uniforms.res.value.set(w * pr, h * pr); tiltV.uniforms.res.value.set(w * pr, h * pr);
}
addEventListener('resize', resize); resize();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  if (!paused) {
    T += dt;
    for (const tw of tweens.slice()) { const p = Math.min(1, (T - tw.t0) / tw.dur); tw.fn(tw.e(p)); if (p >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.r(); } }
    for (const t of timers.slice()) if (T >= t.at) { timers.splice(timers.indexOf(t), 1); t.r(); }
  }
  const k = 1 - Math.exp(-dt * 2.2);
  if (hd) { cam.pos.lerp(want.pos, k); cam.look.lerp(want.look, k); }
  else { cam.look.lerp(want.look, k); cam.pos.lerp(new THREE.Vector3(cam.look.x, 20, cam.look.z + .01), k); }
  camera.position.copy(cam.pos); if (shake > 0) { camera.position.x += (Math.random() - .5) * shake; camera.position.y += (Math.random() - .5) * shake; shake *= .85; }
  camera.lookAt(cam.look);
  const d = cam.pos.clone().sub(cam.look); camYaw = Math.atan2(d.x, d.z); camPitch = hd ? Math.atan2(d.y, Math.hypot(d.x, d.z)) : 0;
  for (const f of flickers) { const n = Math.sin(T * 13 + f.ph) * .5 + Math.sin(T * 7.3 + f.ph * 2) * .5; f.l.intensity = hd ? f.base * (1 + n * .12) : 0; }
  ship.position.y = Math.sin(T * .7) * .04; ship.rotation.x = Math.sin(T * .55) * .008;
  waterT.offset.set(T * .01, T * .006);
  for (const s of wisps) { s.position.x += s.userData.v * dt; if (s.position.x > 20) s.position.x = -20; s.visible = hd; }
  Object.values(actors).forEach(a => a.update());
  for (const b of billboards) { b.rotation.y = camYaw; b.rotation.x = -camPitch * .45; }
  for (const p of live.slice()) {
    const age = T - p.t0; if (age > p.life) { p.el.remove(); live.splice(live.indexOf(p), 1); continue; }
    const [x, y] = project(p.a.head()); p.el.style.left = x + 'px'; p.el.style.top = (y - (p.rise ? age * 40 : 0)) + 'px'; p.el.style.opacity = p.rise ? Math.min(1, (p.life - age) * 3) : 1;
  }
  const f = cam.look.clone().project(camera); tiltH.uniforms.focus.value = tiltV.uniforms.focus.value = (f.y + 1) / 2;
  grade.uniforms.time.value = T;
  if (hd) composer.render(); else renderer.render(scene, camera);
}
$('btn-pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Reprendre' : 'Pause'; };
$('btn-replay').onclick = () => { paused = false; $('btn-pause').textContent = 'Pause'; reset(); };
$('btn-mode').onclick = e => {
  hd = !hd; e.target.textContent = hd ? 'Vue : HD-2D' : 'Vue : à plat';
  scene.fog = hd ? new THREE.FogExp2(FOG, .05) : null; hemi.intensity = hd ? .55 : 1.5; moon.castShadow = hd;
};
loadPL().then(() => { buildPL(); reset(); frame(); });
</script>
