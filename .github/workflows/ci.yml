name: CI

# Every PR is checked; pushes to main are checked again after the merge.
# Feature-branch pushes are not, so a PR does not run twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Only the latest push on a ref matters.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless in a fresh checkout and bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: promptus
          POSTGRES_USER: promptus
          POSTGRES_PASSWORD: promptus_ci
        ports:
          - 5432:5432
        # Over TCP, as in docker-compose.dev.yml: during first-start init
        # the server listens on the Unix socket only and is not ready yet.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U promptus -d promptus"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://promptus:promptus_ci@localhost:5432/promptus
      TEST_DATABASE_URL: postgres://promptus:promptus_ci@localhost:5432/promptus_test

    steps:
      - uses: actions/checkout@v4

      # The workspace includes the Tauri shell, which links against
      # WebKitGTK: clippy and the tests compile it, so it needs the
      # system libraries Tauri documents for Debian/Ubuntu.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config

      # rust-toolchain.toml pins the channel; rustup honours it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # The dev compose file mounts this script into the Postgres image;
      # a service container cannot mount the checkout, so it is replayed
      # here. Same script, same database name as in development.
      - name: Create the test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/create-test-db.sql

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  front:
    name: Front (ESLint, tsc, knip, Vitest)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Same version as the PCT 105 dev container.
          bun-version: 1.4.2

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('front/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--bun` runs the Node CLIs on Bun, as in development where there
      # is no Node at all; the runner's own Node would otherwise be used.
      - name: ESLint
        run: bun --bun run lint

      - name: Type check
        run: bun --bun run typecheck

      - name: Dead code (knip)
        run: bun --bun run knip

      - name: Vitest
        run: bun --bun run test

  mcp:
    name: MCP server (tsc, bun test)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      # The Promptus API is a mocked fetch: no server, no database.
      - name: Tests
        run: bun test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04

    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed then deleted is still leaked.
          fetch-depth: 0

      # The release binary rather than gitleaks-action, which needs a paid
      # licence on organisation accounts; pinned and checksummed.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
