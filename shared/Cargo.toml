[package]
name = "promptus_shared"
version = "0.1.0"
edition = "2024"

[dependencies]
# engine/model-rule-system — a rule system is a YAML file deserialized
# straight into typed data, then validated.
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
# engine/roll-checks — dice behind an injectable source; ChaCha8 gives
# a seeded stream that stays stable across rand releases.
rand = "0.9"
rand_chacha = "0.9"
