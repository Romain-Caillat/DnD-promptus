services:
  db:
    image: postgres:16-alpine
    container_name: promptus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: promptus
      POSTGRES_PASSWORD: promptus_dev
      POSTGRES_DB: promptus
    ports:
      - "5433:5432"
    volumes:
      - promptus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptus -d promptus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  promptus_pg_data:
