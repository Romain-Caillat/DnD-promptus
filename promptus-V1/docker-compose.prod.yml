services:
  db:
    image: postgres:16-alpine
    container_name: promptus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: promptus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: promptus
    volumes:
      - promptus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptus -d promptus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: promptus-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://promptus:${DB_PASSWORD}@db:5432/promptus
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-huggingface}
      NODE_ENV: production
    volumes:
      - ./public/audio:/app/public/audio
      - ./public/generated-images:/app/public/generated-images
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: promptus-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  promptus_pg_data:
  caddy_data:
  caddy_config:
