# The board's example (« Règles », moment 5), formalised. It comes with
# the preset so a GM sees one at work; deleting it changes nothing else.
house_rules:
  - id: morts_vivants_feu
    name: Les morts-vivants craignent le feu
    text: "Les morts-vivants ont peur du feu : quand l'un d'eux prend des dégâts de feu, il est effrayé jusqu'à la fin de son prochain tour."
    formal:
      when: hit
      damage_type: feu
      target: { traits: [mort_vivant] }
      effects:
        - { apply: { condition: effraye, turns: 1, to: targets } }
      players: effect
      cases:
        - { name: Torche contre zombie, actor: { class: guerrier }, action: torche, target: { adversary: zombie }, roll: hit, expect: applies }
        - { name: Trait de feu contre squelette, actor: { class: magicien }, action: trait_de_feu, target: { adversary: squelette }, roll: hit, expect: applies }
        - { name: Torche contre le chef gobelin, actor: { class: guerrier }, action: torche, target: { adversary: chef_gobelin }, roll: critical, expect: nothing }
        - { name: Épée contre zombie, actor: { class: guerrier }, action: epee_longue, target: { adversary: zombie }, roll: hit, expect: nothing }
