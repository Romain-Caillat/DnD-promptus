# Équipage spatial — pack de pièces de personnage (characters/render-layered-sprite).
#
# Généré une fois depuis les formes des prototypes (docs/design/sprite-prototype.py,
# docs/design/avatar.py) : même grille 20 x 26, profil tourné vers la droite.
# Ce fichier est maintenant la source : on l'édite à la main.
#
# Format (shared/src/sprite/pack.rs) : chaque pièce est une pile de calques,
# chaque calque une petite grille de caractères posée en `at` et rangée à une
# profondeur (`depth`). La légende traduit un caractère en couleur : une
# couleur fixe du pack, ou un emplacement que la description recolore —
# `skin` (peau), `hair` (cheveux et barbe), `dye` et `accent` (couleurs de la
# pièce, palette `cloth`). Une pièce qui se pose sur le corps a une variante
# par corps (`per_body`). Chaque pièce se dessine dans trois directions :
# `east` (profil droit), `south` (de face) et `north` (de dos) ; `west` est
# le miroir de `east`. Une liste vide (`north: []`) dit qu'on ne voit pas la
# pièce de ce côté. Les vues de face et de dos ont été tirées une fois du
# profil par docs/design/sprite-turn.py (characters/walk-in-four-directions)
# et s'éditent maintenant à la main, comme le reste.
