# Corsaires de la Couronne, acte 1, scène 4 — la bagarre du quai.
# Source : dnd-save/DnD-16-05-2026/Acte_1/acte_1.md. Six PJ contre
# Gueule-Rouge et cinq marins, de nuit, dans le brouillard, entre les
# entrepôts et l'appontement où La Mâchoire est amarrée.
version: 1
id: quai-port-louis
name: Le quai de Port-Louis
scale: encounter
theme: port-1718
ambience:
  time: night
  weather: fog
  sight_limit: 10
  mood: quai-tension
  wind: { from: w, strength: 1 }
gm_notes: >-
  Combat tutoriel : expliquer initiative, actions et jets d'attaque au
  premier tour. Gueule-Rouge vise le PJ qui a l'air le plus fort. Si trois
  marins tombent, les deux autres fuient ; si Gueule-Rouge tombe, tous
  fuient.
layers:
  - { id: base, name: Quai, visibility: all }
  - { id: embuscade, name: Embuscade de Gueule-Rouge, visibility: gm }
  - { id: secrets, name: Secrets, visibility: gm }
