# Corsaires de la Couronne, acte 2 — l'abordage du Greyhound.
# INVENTÉ — à valider par Romain. La Mâchoire (au nord) et le Greyhound
# (au sud) bord à bord, reliés par les grappins et deux planches ; la mer
# entre les coques ne se traverse pas. Six PJ sur le pont de La Mâchoire,
# l'équipage du Greyhound sur le sien. Carte du combat au sol qui
# remplace la bataille navale le temps de l'abordage
# (engine/support-vehicle-combat).
