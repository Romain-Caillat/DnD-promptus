# Le Brasier — la coursive centrale du Cure-Dent (HMS-230 132).
# Source : dnd-save/DnD_07-06-2026/Plan_Cure-Dent.svg, « 1 case = 1 unité
# de déplacement intérieur ». De la porte de la passerelle (nord) à la
# salle des machines (sud) : accès aux tourelles, poste Intégrité &
# avaries, les deux sas d'abordage, une gaine technique cachée. Prévue
# pour repousser six abordeurs Vorr avec six PJ.
version: 1
id: cure-dent-coursive
name: Coursive du Cure-Dent
scale: encounter
theme: vaisseau-confederation
ambience:
  light: dim
  mood: coursive-alerte
gm_notes: >-
  Les Vorr ont arrimé leur navette au sas bâbord. LUMEN signale la brèche
  avec un temps de retard. La balise de la gaine technique explique
  comment ils ont retrouvé le Cure-Dent.
layers:
  - { id: base, name: Coursive, visibility: all }
  - { id: abordage, name: Escouade Vorr, visibility: gm }
  - { id: secrets, name: Secrets, visibility: gm }
grid:
  legend:
    "#": { terrain: cloison, wall: true }
    ".": { terrain: métal }
    "g": { terrain: grille, difficult: true }
  rows:
    - "###############"
    - "#.............#"
    - "#.............#"
    - "######...######"
    - "######...######"
    - "######...#....#"
    - "######...#....#"
    - "######...#....#"
    - "######...######"
    - "#....#...#....#"
    - "#....#...#....#"
    - "#....#...#....#"
    - "######...######"
    - "#gggg#...######"
    - "#gggg#...######"
    - "######...######"
    - "#.............#"
    - "#.............#"
    - "#.............#"
    - "###############"
doors:
  - { id: porte-passerelle, at: [7, 0], state: closed, label: Porte de la passerelle }
  - { id: porte-integrite, at: [9, 6], state: open, label: Poste Intégrité & avaries }
  - { id: sas-babord-interieur, at: [5, 10], state: closed, label: "Sas bâbord, porte intérieure" }
  - { id: sas-babord-exterieur, at: [0, 10], state: locked, label: "Sas bâbord, écoutille extérieure" }
  - { id: sas-tribord-interieur, at: [9, 10], state: open, label: "Sas tribord, porte intérieure" }
  - { id: sas-tribord-exterieur, at: [14, 10], state: locked, label: "Sas tribord, écoutille extérieure" }
  - { id: trappe-maintenance, at: [5, 13], state: closed, label: Trappe de maintenance, layer: secrets }
props:
