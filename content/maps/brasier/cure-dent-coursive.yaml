  - { id: echelle-tribord, kind: echelle, label: Échelle de la tourelle tribord, at: [13, 1], climbable: true }
  - { id: echelle-dorsale, kind: echelle, label: Échelle de la tourelle dorsale, at: [7, 2], climbable: true }
  - { id: console-integrite, kind: console, label: Intégrité & avaries (CON), at: [12, 6], cover: half, blocks_movement: true }
  - { id: casiers-sas, kind: casiers, label: Casiers à combinaisons, at: [12, 9], cover: three_quarters, blocks_movement: true }
  - { id: reacteur, kind: reacteur, label: Réacteur, at: [6, 17], size: [3, 2], cover: total, blocks_movement: true }
  - { id: pupitre-ingenieur, kind: console, label: Salle des machines (INT), at: [2, 17], cover: half, blocks_movement: true }
  - { id: conduites, kind: conduites, label: Conduites de refroidissement, at: [10, 16], size: [3, 1], difficult: true }
