[package]
name = "promptus_back"
version = "0.1.0"
edition = "2024"

[dependencies]
promptus_shared = { path = "../shared" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace"] }
# platform/sign-in-gm — passkeys, and the hashing of session tokens.
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
webauthn-rs-proto = "0.5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# session/stream-live-changes — a real WebSocket client against a real server.
tokio-tungstenite = "0.29"
futures-util = "0.3"
# A software authenticator: real key pairs signing the server's real
# challenges, so the ceremonies are tested end to end without a browser.
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
