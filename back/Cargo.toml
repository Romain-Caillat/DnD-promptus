[package]
name = "promptus_back"
version = "0.1.0"
edition = "2024"

[dependencies]
promptus_shared = { path = "../shared" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace"] }
# platform/sign-in-gm — the hashing of session tokens and sign-in codes.
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# ai/route-llm-provider — OpenRouter over HTTPS (rustls: no system OpenSSL
# at run time). Honours HTTPS_PROXY.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# campaign/edit-rule-system — a rule draft between YAML text and the
# structured editor's JSON tree (same crate as `shared`).
serde_yaml_ng = "0.10"
# session/pair-shared-screen — the QR a TV shows next to its code (SVG
# only: no image codecs).
qrcode ={ version = "0.14.1", default-features = false, features = ["svg"] }
# platform/sign-in-gm — sign-in codes by email, over SMTP with STARTTLS
# (rustls: no system OpenSSL at run time).
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# session/stream-live-changes — a real WebSocket client against a real server.
tokio-tungstenite = "0.29"
futures-util = "0.3"
